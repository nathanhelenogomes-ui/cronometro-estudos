<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronômetro de Estudos</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 12px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
      color: #37352f;
    }

    .card {
      width: min(680px, 100%);
      padding: 28px;
      border: 1px solid rgba(55, 53, 47, .16);
      border-radius: 16px;
      background: #fff;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0,0,0,.06);
    }

    .eyebrow {
      font-size: 13px;
      opacity: .62;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .subject-wrap {
      margin: 18px auto 20px;
      text-align: left;
      max-width: 420px;
    }

    .subject-wrap label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 650;
      opacity: .72;
    }

    .subject-wrap select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 9px;
      border: 1px solid rgba(55, 53, 47, .18);
      background: #fff;
      color: #37352f;
      font: inherit;
    }

    #display {
      margin: 12px 0 24px;
      font-variant-numeric: tabular-nums;
      font-size: clamp(44px, 11vw, 82px);
      line-height: 1;
      font-weight: 750;
      letter-spacing: .02em;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid rgba(55, 53, 47, .18);
      background: #fff;
      color: #37352f;
      padding: 11px 16px;
      border-radius: 9px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: #f7f6f3; }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .primary {
      background: #37352f;
      color: #fff;
    }

    .meta {
      margin-top: 18px;
      font-size: 13px;
      opacity: .62;
      min-height: 20px;
    }

    @media (prefers-color-scheme: dark) {
      body { color: #f1f1ef; }
      .card {
        background: #191919;
        border-color: rgba(255,255,255,.14);
      }
      button {
        background: #252525;
        color: #f1f1ef;
        border-color: rgba(255,255,255,.15);
      }
      button:hover { background: #303030; }
      .subject-wrap select {
        background: #252525;
        color: #f1f1ef;
        border-color: rgba(255,255,255,.15);
      }
      .primary {
        background: #f1f1ef;
        color: #191919;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="eyebrow">Tempo de estudo</div>
    <div class="subject-wrap">
      <label for="materia">Matéria</label>
      <select id="materia">
        <option value="Administração e Política Públicas">Administração e Política Públicas</option>
        <option value="AFO">AFO</option>
        <option value="Auditoria">Auditoria</option>
        <option value="CASP">CASP</option>
        <option value="Controladoria Geral da União">Controladoria Geral da União</option>
        <option value="Direito Administrativo">Direito Administrativo</option>
        <option value="Direito Constitucional">Direito Constitucional</option>
        <option value="Discursiva">Discursiva</option>
        <option value="Finanças">Finanças</option>
        <option value="Português">Português</option>
        <option value="Inglês">Inglês</option>
        <option value="Simulados">Simulados</option>
      </select>
    </div>

    <div class="subject-wrap">
      <label for="aula">Aula</label>
      <select id="aula"><option value="">Selecione uma matéria primeiro</option></select>
    </div>

    <div id="display">00:00:00</div>

    <div class="controls">
      <button id="start" class="primary">▶ Iniciar</button>
      <button id="pause" disabled>⏸ Pausar</button>
      <button id="finish" disabled>■ Finalizar</button>
      <button id="reset">↻ Zerar</button>
    </div>

    <div class="subject-wrap">
      <label for="questoes">Questões resolvidas</label>
      <input id="questoes" type="number" min="0" step="1" placeholder="0" style="width:100%;padding:11px 12px;border-radius:9px;border:1px solid rgba(55,53,47,.18);font:inherit">
    </div>
    <div class="subject-wrap">
      <label for="erros">Erros (CESPE)</label>
      <input id="erros" type="number" min="0" step="1" placeholder="0" style="width:100%;padding:11px 12px;border-radius:9px;border:1px solid rgba(55,53,47,.18);font:inherit">
    </div>
    <div class="controls"><button id="saveQuestions" class="primary">✓ Salvar questões</button></div>
    <div class="meta" id="status">Pronto para estudar</div>
  </main>

  <script>
    (() => {
      const W="https://cronometro-estudos-notion.nathanhelenogomes.workers.dev";
      const $=id=>document.getElementById(id);
      const display=$("display"),startBtn=$("start"),pauseBtn=$("pause"),finishBtn=$("finish"),resetBtn=$("reset"),status=$("status"),materia=$("materia"),aula=$("aula"),questoes=$("questoes"),erros=$("erros"),saveQ=$("saveQuestions");
      const KE="cronometroEstudos.elapsed",KS="cronometroEstudos.startedAt",KP="cronometroEstudos.pendingPause";
      let acc=Number(localStorage.getItem(KE)||0), st=localStorage.getItem(KS); let started=st?Number(st):null,running=started!==null,timer=null,sync=false;
      const pad=n=>String(n).padStart(2,"0"); const elapsed=()=>acc+(running?Date.now()-started:0);
      function fmt(ms){const s=Math.floor(Math.max(0,ms)/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`}
      function save(){localStorage.setItem(KE,String(acc));running?localStorage.setItem(KS,String(started)):localStorage.removeItem(KS)}
      function render(){display.textContent=fmt(elapsed());startBtn.disabled=running||sync;pauseBtn.disabled=!running||sync;finishBtn.disabled=sync||(!running&&acc<=0);startBtn.textContent=running?"▶ Em andamento":acc>0?"▶ Retomar":"▶ Iniciar"}
      function tick(){clearInterval(timer);timer=setInterval(render,200)} function stop(){clearInterval(timer);timer=null}
      async function post(body){const r=await fetch(W,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d?.notion?.message||d.error||"Erro desconhecido");return d}
      async function loadAulas(){aula.disabled=true;aula.innerHTML='<option>Carregando...</option>';try{const r=await fetch(`${W}?action=aulas&materia=${encodeURIComponent(materia.value)}`),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error);aula.innerHTML='<option value="">Selecione a aula</option>';d.aulas.forEach(x=>{const o=document.createElement("option");o.value=x.id;o.textContent=x.nome;aula.appendChild(o)});if(!d.aulas.length)aula.innerHTML='<option value="">Nenhuma aula encontrada</option>'}catch(e){status.textContent=`✕ ${e.message}`}finally{aula.disabled=false}}
      async function pending(){const raw=localStorage.getItem(KP);if(!raw||sync)return;const p=JSON.parse(raw);sync=true;render();try{await post({action:"pause",...p});localStorage.removeItem(KP);status.textContent=`✓ ${fmt(p.segundos*1000)} registrado em ${p.materia}.`}catch(e){status.textContent=`✕ ${e.message}. Lançamento pendente.`}finally{sync=false;render()}}
      startBtn.onclick=async()=>{if(localStorage.getItem(KP)){await pending();if(localStorage.getItem(KP))return}started=Date.now();running=true;save();tick();render()};
      pauseBtn.onclick=async()=>{const now=Date.now(),ms=now-started,s=Math.floor(ms/1000);acc+=ms;started=null;running=false;save();stop();render();if(s>0){localStorage.setItem(KP,JSON.stringify({materia:materia.value,segundos:s,eventId:crypto.randomUUID()}));await pending()}};
      finishBtn.onclick=async()=>{if(running){await pauseBtn.onclick();if(localStorage.getItem(KP))return}acc=0;localStorage.removeItem(KE);localStorage.removeItem(KS);render();status.textContent="✓ Sessão finalizada."};
      resetBtn.onclick=()=>{if(localStorage.getItem(KP)){status.textContent="Há lançamento pendente; não vou apagá-lo.";return}stop();acc=0;started=null;running=false;localStorage.removeItem(KE);localStorage.removeItem(KS);render()};
      saveQ.onclick=async()=>{const q=Number(questoes.value),e=Number(erros.value);if(!aula.value)return status.textContent="Selecione uma aula.";if(!Number.isInteger(q)||q<=0)return status.textContent="Informe uma quantidade válida de questões.";if(!Number.isInteger(e)||e<0||e>q)return status.textContent="Erros deve ficar entre 0 e o total de questões.";saveQ.disabled=true;try{const d=await post({action:"saveQuestions",materia:materia.value,aulaId:aula.value,questoes:q,erros:e,eventId:crypto.randomUUID()});status.textContent=`✓ ${q} questões salvas. Aula: ${d.totalAula}. Matéria: ${d.totalMateria}.`}catch(x){status.textContent=`✕ ${x.message}`}finally{saveQ.disabled=false}};
      materia.onchange=loadAulas;render();if(running)tick();if(localStorage.getItem(KP))pending();loadAulas();
    })();
  </script>
</body>
</html>
