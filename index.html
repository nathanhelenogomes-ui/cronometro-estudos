<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronômetro de Estudos</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 12px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
      color: #37352f;
    }

    .card {
      width: min(680px, 100%);
      padding: 28px;
      border: 1px solid rgba(55, 53, 47, .16);
      border-radius: 16px;
      background: #fff;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0,0,0,.06);
    }

    .eyebrow {
      font-size: 13px;
      opacity: .62;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .subject-wrap {
      margin: 18px auto 20px;
      text-align: left;
      max-width: 420px;
    }

    .subject-wrap label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 650;
      opacity: .72;
    }

    .subject-wrap select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 9px;
      border: 1px solid rgba(55, 53, 47, .18);
      background: #fff;
      color: #37352f;
      font: inherit;
    }

    #display {
      margin: 12px 0 24px;
      font-variant-numeric: tabular-nums;
      font-size: clamp(44px, 11vw, 82px);
      line-height: 1;
      font-weight: 750;
      letter-spacing: .02em;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid rgba(55, 53, 47, .18);
      background: #fff;
      color: #37352f;
      padding: 11px 16px;
      border-radius: 9px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: #f7f6f3; }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .primary {
      background: #37352f;
      color: #fff;
    }

    .meta {
      margin-top: 18px;
      font-size: 13px;
      opacity: .62;
      min-height: 20px;
    }

    .custom-select { position: relative; width: 100%; }
    .custom-select-button { width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 12px; border-radius:9px; border:1px solid rgba(55,53,47,.18); background:#fff; color:#37352f; font:inherit; cursor:pointer; text-align:left; }
    .custom-select-button:focus { outline:2px solid rgba(55,53,47,.22); outline-offset:2px; }
    .custom-select-button:disabled { opacity:.55; cursor:not-allowed; }
    .custom-select-arrow { font-size:12px; transition:transform .15s ease; }
    .custom-select.open .custom-select-arrow { transform:rotate(180deg); }
    .custom-select-menu { display:none; position:absolute; z-index:9999; left:0; right:0; top:calc(100% + 6px); max-height:250px; overflow-y:auto; padding:6px; border:1px solid rgba(55,53,47,.18); border-radius:10px; background:#fff; box-shadow:0 10px 30px rgba(0,0,0,.14); }
    .custom-select.open .custom-select-menu { display:block; }
    .custom-option { width:100%; padding:9px 10px; border:0; border-radius:7px; background:transparent; color:#37352f; font:inherit; text-align:left; cursor:pointer; }
    .custom-option:hover, .custom-option:focus { background:#f1f1ef; outline:none; }
    @media (prefers-color-scheme: dark) {
      body { color: #f1f1ef; }
      .card {
        background: #191919;
        border-color: rgba(255,255,255,.14);
      }
      button {
        background: #252525;
        color: #f1f1ef;
        border-color: rgba(255,255,255,.15);
      }
      button:hover { background: #303030; }
      .subject-wrap select {
        background: #252525;
        color: #f1f1ef;
        border-color: rgba(255,255,255,.15);
      }
      .custom-select-button, .custom-select-menu { background:#252525; color:#f1f1ef; border-color:#444; }
      .custom-option { color:#f1f1ef; }
      .custom-option:hover, .custom-option:focus { background:#333; }
      .primary {
        background: #f1f1ef;
        color: #191919;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="eyebrow">Tempo de estudo</div>
    <div class="subject-wrap">
      <label for="materia">Matéria</label>
      <div class="custom-select" id="materiaDropdown">
        <button type="button" class="custom-select-button" id="materiaButton" aria-expanded="false">
          <span id="materiaLabel">Português</span><span class="custom-select-arrow">▼</span>
        </button>
        <div class="custom-select-menu" id="materiaMenu"></div>
      </div>
    </div>

    <div class="subject-wrap">
      <label for="aula">Aula</label>
      <div class="custom-select" id="aulaDropdown">
        <button type="button" class="custom-select-button" id="aulaButton" aria-expanded="false">
          <span id="aulaLabel">Carregando aulas...</span><span class="custom-select-arrow">▼</span>
        </button>
        <div class="custom-select-menu" id="aulaMenu"></div>
      </div>
    </div>

    <div id="display">00:00:00</div>

    <div class="controls">
      <button id="start" class="primary">▶ Iniciar</button>
      <button id="pause" disabled>⏸ Pausar</button>
      <button id="finish" disabled>■ Finalizar</button>
      <button id="reset">↻ Zerar</button>
    </div>

    <div class="subject-wrap">
      <label for="questoes">Questões resolvidas</label>
      <input id="questoes" type="number" min="0" step="1" placeholder="0" style="width:100%;padding:11px 12px;border-radius:9px;border:1px solid rgba(55,53,47,.18);font:inherit">
    </div>
    <div class="subject-wrap">
      <label for="erros">Erros (CESPE)</label>
      <input id="erros" type="number" min="0" step="1" placeholder="0" style="width:100%;padding:11px 12px;border-radius:9px;border:1px solid rgba(55,53,47,.18);font:inherit">
    </div>
    <div class="controls"><button id="saveQuestions" class="primary">✓ Salvar questões</button></div>
    <div class="meta" id="status">Pronto para estudar</div>
  </main>

  <script>
    (() => {
      const W="https://cronometro-estudos-notion.nathanhelenogomes.workers.dev";
      const $=id=>document.getElementById(id);
      const display=$("display"),startBtn=$("start"),pauseBtn=$("pause"),finishBtn=$("finish"),resetBtn=$("reset"),status=$("status"),questoes=$("questoes"),erros=$("erros"),saveQ=$("saveQuestions");
      const materiaDD=$("materiaDropdown"),materiaBtn=$("materiaButton"),materiaLabel=$("materiaLabel"),materiaMenu=$("materiaMenu");
      const aulaDD=$("aulaDropdown"),aulaBtn=$("aulaButton"),aulaLabel=$("aulaLabel"),aulaMenu=$("aulaMenu");
      const materias=["Administração e Política Públicas","AFO","Auditoria","CASP","Controladoria Geral da União","Direito Administrativo","Direito Constitucional","Discursiva","Finanças","Português","Inglês","Simulados"];
      let materiaValue="Português", aulaValue="";
      const KE="cronometroEstudos.elapsed",KS="cronometroEstudos.startedAt",KP="cronometroEstudos.pendingPause";
      let acc=Number(localStorage.getItem(KE)||0), st=localStorage.getItem(KS); let started=st?Number(st):null,running=started!==null,timer=null,sync=false;
      const pad=n=>String(n).padStart(2,"0"); const elapsed=()=>acc+(running?Date.now()-started:0);
      function fmt(ms){const s=Math.floor(Math.max(0,ms)/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`}
      function save(){localStorage.setItem(KE,String(acc));running?localStorage.setItem(KS,String(started)):localStorage.removeItem(KS)}
      function render(){const tempo=fmt(elapsed());display.textContent=tempo;startBtn.disabled=running||sync;pauseBtn.disabled=!running||sync;finishBtn.disabled=sync||(!running&&acc<=0);startBtn.textContent=running?"▶ Em andamento":acc>0?"▶ Retomar":"▶ Iniciar";document.title=`${running?"⏱":"⏸"} ${tempo} | ${materiaValue || "Cronômetro"}`}
      function tick(){clearInterval(timer);timer=setInterval(render,200)} function stop(){clearInterval(timer);timer=null}
      async function post(body){const r=await fetch(W,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d?.notion?.message||d.error||"Erro desconhecido");return d}

      function closeDropdown(dd,btn){dd.classList.remove("open");btn.setAttribute("aria-expanded","false")}
      function toggleDropdown(dd,btn,other,otherBtn){closeDropdown(other,otherBtn);const open=!dd.classList.contains("open");dd.classList.toggle("open",open);btn.setAttribute("aria-expanded",String(open))}
      function optionButton(text,onClick){const b=document.createElement("button");b.type="button";b.className="custom-option";b.textContent=text;b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();onClick()});return b}
      materias.forEach(m=>materiaMenu.appendChild(optionButton(m,()=>{materiaValue=m;materiaLabel.textContent=m;closeDropdown(materiaDD,materiaBtn);loadAulas()})));
      materiaBtn.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();toggleDropdown(materiaDD,materiaBtn,aulaDD,aulaBtn)});
      aulaBtn.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();if(!aulaBtn.disabled)toggleDropdown(aulaDD,aulaBtn,materiaDD,materiaBtn)});
      document.addEventListener("click",()=>{closeDropdown(materiaDD,materiaBtn);closeDropdown(aulaDD,aulaBtn)});
      materiaMenu.addEventListener("click",e=>e.stopPropagation()); aulaMenu.addEventListener("click",e=>e.stopPropagation());

      async function loadAulas(){aulaValue="";aulaBtn.disabled=true;aulaLabel.textContent="Carregando aulas...";aulaMenu.innerHTML="";try{const r=await fetch(`${W}?action=aulas&materia=${encodeURIComponent(materiaValue)}`),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error);if(!d.aulas.length){aulaLabel.textContent="Nenhuma aula encontrada";return}aulaLabel.textContent="Selecione a aula";d.aulas.forEach(x=>aulaMenu.appendChild(optionButton(x.nome,()=>{aulaValue=x.id;aulaLabel.textContent=x.nome;closeDropdown(aulaDD,aulaBtn)})));}catch(e){aulaLabel.textContent="Erro ao carregar aulas";status.textContent=`✕ ${e.message}`}finally{aulaBtn.disabled=false}}
      async function pending(){const raw=localStorage.getItem(KP);if(!raw||sync)return;const p=JSON.parse(raw);sync=true;render();try{await post({action:"pause",...p});localStorage.removeItem(KP);status.textContent=`✓ ${fmt(p.segundos*1000)} registrado em ${p.materia}.`}catch(e){status.textContent=`✕ ${e.message}. Lançamento pendente.`}finally{sync=false;render()}}
      startBtn.onclick=async()=>{if(localStorage.getItem(KP)){await pending();if(localStorage.getItem(KP))return}started=Date.now();running=true;save();tick();render()};
      pauseBtn.onclick=async()=>{const now=Date.now(),ms=now-started,s=Math.floor(ms/1000);acc+=ms;started=null;running=false;save();stop();render();if(s>0){localStorage.setItem(KP,JSON.stringify({materia:materiaValue,segundos:s,eventId:crypto.randomUUID()}));await pending()}};
      finishBtn.onclick=async()=>{if(running){await pauseBtn.onclick();if(localStorage.getItem(KP))return}acc=0;localStorage.removeItem(KE);localStorage.removeItem(KS);render();status.textContent="✓ Sessão finalizada."};
      resetBtn.onclick=()=>{if(localStorage.getItem(KP)){status.textContent="Há lançamento pendente; não vou apagá-lo.";return}stop();acc=0;started=null;running=false;localStorage.removeItem(KE);localStorage.removeItem(KS);render()};
      saveQ.onclick=async()=>{const q=Number(questoes.value),e=Number(erros.value);if(!aulaValue)return status.textContent="Selecione uma aula.";if(!Number.isInteger(q)||q<=0)return status.textContent="Informe uma quantidade válida de questões.";if(!Number.isInteger(e)||e<0||e>q)return status.textContent="Erros deve ficar entre 0 e o total de questões.";saveQ.disabled=true;try{const d=await post({action:"saveQuestions",materia:materiaValue,aulaId:aulaValue,questoes:q,erros:e,eventId:crypto.randomUUID()});status.textContent=`✓ ${q} questões salvas. Aula: ${d.totalAula}. Matéria: ${d.totalMateria}.`}catch(x){status.textContent=`✕ ${x.message}`}finally{saveQ.disabled=false}};
      render();if(running)tick();if(localStorage.getItem(KP))pending();loadAulas();
    })();
  </script>
</body>
</html>
