<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronômetro de Estudos</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 12px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
      color: #37352f;
    }

    .card {
      width: min(680px, 100%);
      padding: 28px;
      border: 1px solid rgba(55, 53, 47, .16);
      border-radius: 16px;
      background: #fff;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0,0,0,.06);
    }

    .eyebrow {
      font-size: 13px;
      opacity: .62;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .subject-wrap {
      margin: 18px auto 20px;
      text-align: left;
      max-width: 420px;
    }

    .subject-wrap label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 650;
      opacity: .72;
    }

    .subject-wrap select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 9px;
      border: 1px solid rgba(55, 53, 47, .18);
      background: #fff;
      color: #37352f;
      font: inherit;
    }

    #display {
      margin: 12px 0 24px;
      font-variant-numeric: tabular-nums;
      font-size: clamp(44px, 11vw, 82px);
      line-height: 1;
      font-weight: 750;
      letter-spacing: .02em;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid rgba(55, 53, 47, .18);
      background: #fff;
      color: #37352f;
      padding: 11px 16px;
      border-radius: 9px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: #f7f6f3; }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .primary {
      background: #37352f;
      color: #fff;
    }

    .meta {
      margin-top: 18px;
      font-size: 13px;
      opacity: .62;
      min-height: 20px;
    }

    @media (prefers-color-scheme: dark) {
      body { color: #f1f1ef; }
      .card {
        background: #191919;
        border-color: rgba(255,255,255,.14);
      }
      button {
        background: #252525;
        color: #f1f1ef;
        border-color: rgba(255,255,255,.15);
      }
      button:hover { background: #303030; }
      .subject-wrap select {
        background: #252525;
        color: #f1f1ef;
        border-color: rgba(255,255,255,.15);
      }
      .primary {
        background: #f1f1ef;
        color: #191919;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="eyebrow">Tempo de estudo</div>
    <div class="subject-wrap">
      <label for="materia">Matéria</label>
      <select id="materia">
        <option value="Administração e Política Públicas">Administração e Política Públicas</option>
        <option value="AFO">AFO</option>
        <option value="Auditoria">Auditoria</option>
        <option value="CASP">CASP</option>
        <option value="Controladoria Geral da União">Controladoria Geral da União</option>
        <option value="Direito Administrativo">Direito Administrativo</option>
        <option value="Direito Constitucional">Direito Constitucional</option>
        <option value="Discursiva">Discursiva</option>
        <option value="Finanças">Finanças</option>
        <option value="Português">Português</option>
        <option value="Inglês">Inglês</option>
        <option value="Simulados">Simulados</option>
      </select>
    </div>

    <div id="display">00:00:00</div>

    <div class="controls">
      <button id="start" class="primary">▶ Iniciar</button>
      <button id="pause" disabled>⏸ Pausar</button>
      <button id="finish" disabled>■ Finalizar</button>
      <button id="reset">↻ Zerar</button>
    </div>

    <div class="meta" id="status">Pronto para estudar</div>
  </main>

  <script>
    (() => {
      const WORKER_URL = "https://cronometro-estudos-notion.nathanhelenogomes.workers.dev";
      const display = document.getElementById("display");
      const startBtn = document.getElementById("start");
      const pauseBtn = document.getElementById("pause");
      const finishBtn = document.getElementById("finish");
      const resetBtn = document.getElementById("reset");
      const status = document.getElementById("status");
      const materiaSelect = document.getElementById("materia");

      const KEY_ELAPSED = "cronometroEstudos.elapsed";
      const KEY_STARTED = "cronometroEstudos.startedAt";
      const KEY_PENDING = "cronometroEstudos.pendingPause";

      let accumulated = Number(localStorage.getItem(KEY_ELAPSED) || 0);
      let storedStart = localStorage.getItem(KEY_STARTED);
      let startedAt = storedStart ? Number(storedStart) : null;
      let running = startedAt !== null;
      let finished = false, timerId = null, syncing = false;

      const pad = n => String(n).padStart(2, "0");
      const currentElapsed = () => accumulated + (running ? Date.now() - startedAt : 0);

      function formatTime(ms) {
        const s = Math.floor(Math.max(0, ms) / 1000);
        return `${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`;
      }

      function saveState() {
        localStorage.setItem(KEY_ELAPSED, String(accumulated));
        if (running && startedAt !== null) localStorage.setItem(KEY_STARTED, String(startedAt));
        else localStorage.removeItem(KEY_STARTED);
      }

      function render() {
        display.textContent = formatTime(currentElapsed());
        startBtn.disabled = running || syncing;
        pauseBtn.disabled = !running || syncing;
        finishBtn.disabled = syncing || (!running && accumulated <= 0);
        if (running) {
          startBtn.textContent = "▶ Em andamento";
          if (!syncing) status.textContent = "Sessão em andamento";
        } else if (accumulated > 0) {
          startBtn.textContent = "▶ Retomar";
          if (!finished && !syncing) status.textContent = "Sessão pausada";
        } else {
          startBtn.textContent = "▶ Iniciar";
          if (!syncing) status.textContent = "Pronto para estudar";
        }
      }

      function startTicker() { stopTicker(); timerId = setInterval(render, 200); }
      function stopTicker() { if (timerId !== null) { clearInterval(timerId); timerId = null; } }

      async function sendPause(p) {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({action:"pause", materia:p.materia, segundos:p.segundos, eventId:p.eventId})
        });
        const data = await response.json();
        if (!response.ok || !data.ok) {
          throw new Error((data && data.notion && data.notion.message) || data.error || "Erro desconhecido.");
        }
      }

      async function retryPending() {
        const raw = localStorage.getItem(KEY_PENDING);
        if (!raw || syncing) return;
        const p = JSON.parse(raw);
        syncing = true; render();
        status.textContent = `Registrando ${formatTime(p.segundos*1000)} em ${p.materia}...`;
        try {
          await sendPause(p);
          localStorage.removeItem(KEY_PENDING);
          status.textContent = `✓ ${formatTime(p.segundos*1000)} registrado em Horas Dia e Horas Semana (${p.materia}).`;
        } catch (e) {
          status.textContent = `✕ Falha ao registrar: ${e.message}. O lançamento ficou pendente.`;
        } finally { syncing = false; render(); }
      }

      startBtn.addEventListener("click", async () => {
        if (running || syncing) return;
        if (localStorage.getItem(KEY_PENDING)) {
          await retryPending();
          if (localStorage.getItem(KEY_PENDING)) return;
        }
        finished = false; startedAt = Date.now(); running = true;
        saveState(); startTicker(); render();
      });

      pauseBtn.addEventListener("click", async () => {
        if (!running || syncing) return;
        const now = Date.now(), intervalo = Math.max(0, now-startedAt);
        const segundos = Math.floor(intervalo/1000), materia = materiaSelect.value;
        accumulated += intervalo; startedAt = null; running = false; finished = false;
        saveState(); stopTicker(); render();
        if (segundos <= 0) return;
        localStorage.setItem(KEY_PENDING, JSON.stringify({
          materia, segundos,
          eventId: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`
        }));
        await retryPending();
      });

      finishBtn.addEventListener("click", async () => {
        if (running) {
          const now = Date.now(), intervalo = Math.max(0, now-startedAt);
          const segundos = Math.floor(intervalo/1000), materia = materiaSelect.value;
          accumulated += intervalo; startedAt = null; running = false; saveState(); stopTicker();
          if (segundos > 0) {
            localStorage.setItem(KEY_PENDING, JSON.stringify({
              materia, segundos,
              eventId: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`
            }));
            await retryPending();
            if (localStorage.getItem(KEY_PENDING)) return;
          }
        } else if (localStorage.getItem(KEY_PENDING)) {
          await retryPending();
          if (localStorage.getItem(KEY_PENDING)) return;
        }
        finished = true; accumulated = 0;
        localStorage.removeItem(KEY_ELAPSED); localStorage.removeItem(KEY_STARTED);
        render(); status.textContent = "✓ Sessão finalizada. As pausas foram registradas.";
      });

      resetBtn.addEventListener("click", () => {
        if (syncing || localStorage.getItem(KEY_PENDING)) {
          status.textContent = "Há um lançamento pendente; não vou apagá-lo.";
          return;
        }
        stopTicker(); accumulated=0; startedAt=null; running=false; finished=false;
        localStorage.removeItem(KEY_ELAPSED); localStorage.removeItem(KEY_STARTED); render();
      });

      render();
      if (running) startTicker();
      if (localStorage.getItem(KEY_PENDING)) retryPending();
      document.addEventListener("visibilitychange", render);
    })();
  </script>
</body>
</html>
